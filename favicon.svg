<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="favDrop">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" />

  <!-- Radar Wave Ring -->
  <circle cx="32" cy="50" r="10" fill="none" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.2" />

  <!-- Pin Marker with Shadow -->
  <g filter="url(#favDrop)">
    <!-- Pin Body -->
    <path d="M 32 50 C 30 44 18 34 18 26 A 14 14 0 1 1 46 26 C 46 34 34 44 32 50 Z" 
          fill="#ffffff" />

    <!-- Pin Inner Circle (Midnight Blue) -->
    <circle cx="32" cy="26" r="9.5" fill="#0f172a" />

    <!-- Golden Crescent & Star (High Contrast Emblem) -->
    <!-- Crescent -->
    <path d="M 31 20.5 A 5.5 5.5 0 1 0 31 31.5 A 4.4 4.4 0 1 1 31 20.5 Z" 
          fill="url(#favGold)" />

    <!-- 5-Point Star -->
    <!-- Center: (34, 26) -->
    <polygon points="34,23.5 34.8,25 36.5,25.2 35.3,26.4 35.6,28.1 34,27.2 32.4,28.1 32.7,26.4 31.5,25.2 33.2,25" 
             fill="url(#favGold)" />
  </g>

  <!-- Camera Accent Dot (Bottom-Right of Pin) -->
  <circle cx="43" cy="38" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1" />
  <circle cx="43" cy="38" r="1.8" fill="#ffffff" />
</svg>
