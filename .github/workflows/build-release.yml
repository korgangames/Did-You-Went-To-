name: Build & Release Single Executable

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Standalone Windows Executable
        run: |
          python build_exe.py

      - name: Verify Executable Exists
        run: |
          if (Test-Path "TurkeyTravelMap.exe") {
            $size = (Get-Item "TurkeyTravelMap.exe").Length / 1MB
            Write-Host "TurkeyTravelMap.exe compiled successfully ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Error "TurkeyTravelMap.exe was not created!"
            exit 1
          }

      - name: Upload Executable to GitHub Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: TurkeyTravelMap.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
